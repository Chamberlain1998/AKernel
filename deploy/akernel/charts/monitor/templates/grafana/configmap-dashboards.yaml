apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{- $files := .Files.Glob "dashboards/*.json" }}
  {{- if $files }}
  {{- range $path, $file := $files }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
  {{- end }}
