# Buildkite bootstrap for the repository-owned dynamic pipeline.

checkout:
  submodules: false

steps:
  - label: ":pipeline: Initialize AKernel image build"
    key: "initialize"
    command: |
      set -euo pipefail
      wg show wg0
      curl -fsSIL --max-time 30 https://github.com/ -o /dev/null
      denied=$$(curl -sS -o /dev/null -w '%{http_connect}' --max-time 20 https://example.com/ || true)
      test "$$denied" = "403"
      echo "restricted-egress-ok non-whitelist=$$denied"
      bash .buildkite/pipeline.sh | buildkite-agent pipeline upload
    secrets:
      - AKERNEL_WG_CONFIG
    agents:
      queue: "default"
      os: "linux"
      arch: "amd64"
    plugins:
      - kubernetes:
          extraVolumeMounts:
            - name: agent-hooks
              mountPath: /buildkite/hooks
          podSpecPatch:
            imagePullSecrets:
              - name: swr-pull-secret
            initContainers:
              - name: install-egress-hook
                image: "swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/sandbox-packager:v20260506_kubectl"
                command:
                  - /bin/sh
                  - -ec
                  - "printf '%s' '' | base64 -d > /hooks/environment; chmod 755 /hooks/environment"
                volumeMounts:
                  - name: agent-hooks
                    mountPath: /hooks
            containers:
              - name: checkout
                env:
                  - name: BUILDKITE_HOOKS_PATH
                    value: /buildkite/hooks
                  - name: AKERNEL_WG_ENDPOINT_OVERRIDE
                    value: "159.138.22.93:443"
                securityContext:
                  capabilities:
                    add: ["NET_ADMIN"]
              - name: container-0
                image: "swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/sandbox-packager:v20260506_kubectl"
                env:
                  - name: BUILDKITE_HOOKS_PATH
                    value: /buildkite/hooks
                  - name: AKERNEL_WG_ENDPOINT_OVERRIDE
                    value: "159.138.22.93:443"
                securityContext:
                  capabilities:
                    add: ["NET_ADMIN"]
                resources:
                  requests: { cpu: "1", memory: "1Gi" }
                  limits: { cpu: "2", memory: "2Gi" }
            volumes:
              - name: agent-hooks
                emptyDir: {}
    timeout_in_minutes: 10
